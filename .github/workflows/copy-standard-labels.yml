name: Synchronize Standard Labels

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed label manifest
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned manifest reader
        run: python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Synchronize declared labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python governance/sync_labels.py --repo "$REPOSITORY"
