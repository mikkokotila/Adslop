name: Scorecard analysis workflow

on:
  push:
    # Only the default branch is supported.
    branches:
      - main
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed for Code scanning upload
      security-events: write
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      statuses: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Keep repository analysis within this repository.
          publish_results: false

      # Upload the results as artifacts (optional). Commenting out will disable
      # uploads of run results in SARIF format to the repository Actions tab.
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Check code-scanning upload availability
        id: sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${REPOSITORY}")"
          enabled="$(jq -r '.visibility == "public" or .security_and_analysis.advanced_security.status == "enabled" or .security_and_analysis.code_security.status == "enabled"' <<< "$metadata")"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "Code-scanning entitlement is not established; retain the private Actions artifact without a SARIF upload."
          fi

      - name: Upload to code-scanning
        if: steps.sarif.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
