name: Bootstrap Repository

on:
  workflow_dispatch:

# Serialize applications of the reviewed repository configuration.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Apply reviewed main configuration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install bootstrap dependencies
        run: python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      # File and CodeQL changes require the normal slice, version, checks, and
      # review process in a separate PR. This workflow applies main's existing
      # manifest and ruleset; it never rewrites or merges repository files.
      - name: Apply reviewed labels and protected-main ruleset
        env:
          GH_TOKEN: ${{ secrets.REPO_BOOTSTRAP_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REPO_BOOTSTRAP_TOKEN is required to apply reviewed labels and the protected-main ruleset."
            exit 1
          fi
          python governance/bootstrap_repository.py \
            --repo-name "$REPOSITORY_NAME" \
            --owner "$REPOSITORY_OWNER" \
            --github-only
