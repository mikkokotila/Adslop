[build-system]
requires = ["setuptools>=68", "wheel"]
# Local backend: delegates to setuptools, then normalises the sdist so two
# builds of the same source are byte-identical. See build_backend.py.
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "Adslop"
version = "0.11.0"
description = "API-first revenue experimentation for digital products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
keywords = ["advertising", "revenue", "experimentation", "governance"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikko Kotila", email = "mailme@mikkokotila.com" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mikkokotila/Adslop"
Repository = "https://github.com/mikkokotila/Adslop"
Changelog = "https://github.com/mikkokotila/Adslop/blob/main/CHANGELOG.md"
Issues = "https://github.com/mikkokotila/Adslop/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "hypothesis>=6.100,<7",
  "ruff==0.16.1",
  "pyright==1.1.408",
  "vulture>=2.14,<3",
  "coverage[toml]>=7.6,<8",
  "pyyaml>=6.0,<7",
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adslop*"]
exclude = ["tests*", "demo*"]

[tool.check-manifest]
# The sdist is deliberately not a repository snapshot: the enforcement plane
# is how this repository is built, not something a consumer installs.
# check-manifest's globs do not cross '/', so nested trees need their own
# recursive pattern.
ignore = [
  "governance/*",
  "governance/**",
  ".github/*",
  ".github/**",
  "docs-site/*",
  "docs-site/**",
  "apps/*",
  "apps/**",
  "fuzz/*",
  "fuzz/**",
  "scripts/*",
  "scripts/**",
  "SETUP.md",
  "PR_GUIDELINE.md",
  "REPO_SPECIFICS.md",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["adslop"]
exclude = [
  "**/__pycache__",
  "build",
  "dist",
  "tests",
  "demo",
]
# governance/ is not type-checked in CI (include is the package), but listing it
# here lets the editor resolve the gates' bare `import _common` sibling import.
extraPaths = ["governance"]
stubPath = "stubs"
reportExplicitAny = "error"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownLambdaType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportConstantRedefinition = "error"
reportImportCycles = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "demo",
  "governance/tests/fixtures",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "RUF",
  "BLE",
  "ANN",
  "C901",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "T201",
  "FIX001",
  "FIX002",
  "FIX003",
  "FIX004",
  "ERA001",
  "D200",
  "D205",
  "D415",
  "PIE790",
]
ignore = [
  "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", "ANN", "BLE001",
  "PLR0912", "PLR0913", "PLR0915",
  "D200", "D205", "D415",
]
"governance/*.py" = [
  "C901", "PLR0912", "PLR0913", "PLR0915",
  "T201",
  "FIX001", "FIX002", "FIX003", "FIX004",
  "ERA001", "D200", "D205", "D415",
]
"scripts/*.py" = [
  "C901", "PLR0912", "PLR0913", "PLR0915",
  "T201",
  "D200", "D205", "D415",
]
"governance/tests/**/*.py" = [
  "S101", "ANN", "BLE001",
  "PLR0912", "PLR0913", "PLR0915",
  "D200", "D205", "D415",
]

[tool.ruff.lint.isort]
known-first-party = ["governance", "adslop"]

[tool.vulture]
paths = ["adslop"]
min_confidence = 80

[tool.coverage.run]
branch = true
source = ["adslop"]

[tool.coverage.report]
show_missing = true

[tool.coverage.json]
output = "coverage.json"
